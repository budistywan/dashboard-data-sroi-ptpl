<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SROI Dashboard — PT Pertamina Lubricants</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f2;--surf:#fff;--s2:#f0efe9;--s3:#e5e3da;
  --border:#dbd9d0;--border2:#a0a098;
  --ink:#1c1a16;--t2:#6a6860;--t3:#a09e96;
  --green:#15512f;--gnl:#e6f2eb;--gnd:#0c3520;--gnm:#22915a;
  --blue:#173454;--bll:#e5edf5;
  --amber:#6b3800;--aml:#fdf0e0;
  --red:#7a1515;--rdl:#fdf0f0;
  --mono:'IBM Plex Mono',monospace;
  --body:'Sora',sans-serif;
  --r:5px;--rl:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--body);color:var(--ink);font-size:13px;line-height:1.5}
.shell{display:grid;grid-template-columns:188px 1fr;min-height:100vh}
.sidebar{background:#1c1a16;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-top{padding:18px 14px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-eyebrow{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#555;font-weight:600}
.sb-title{font-size:13px;font-weight:500;color:#e8e6e0;margin-top:4px;line-height:1.4}
.sb-nav{padding:8px 0;flex:1}
.sb-grp{padding:10px 14px 3px;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#444;font-weight:600}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 14px;font-size:11.5px;color:#777;cursor:pointer;border-left:2px solid transparent;transition:all .12s;user-select:none}
.sb-item:hover{background:rgba(255,255,255,.04);color:#bbb}
.sb-item.on{background:rgba(255,255,255,.07);color:#ece9e2;border-left-color:var(--gnm);font-weight:500}
.sb-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-item.dim{opacity:.4;pointer-events:none}
.sb-sep{margin:6px 14px;border:none;border-top:1px solid rgba(255,255,255,.05)}
.sb-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.05);font-size:9.5px;color:#3a3835;line-height:1.7}
.main{display:flex;flex-direction:column;min-width:0;overflow-x:hidden}
.breadcrumb{padding:10px 22px;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);min-height:36px;flex-shrink:0;flex-wrap:wrap}
.bc-item{cursor:pointer;color:var(--t2);transition:color .1s}
.bc-item:hover{color:var(--ink)}.bc-item.active{color:var(--ink);font-weight:500;cursor:default}
.bc-sep{color:var(--t3);font-size:10px}
.split{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:0;overflow:hidden}
.ctx{background:var(--surf);border-right:1px solid var(--border);overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.ctx-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ctx-name{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.ctx-sub{font-size:11px;color:var(--t2);margin-top:2px;font-family:var(--mono)}
.ctx-divider{border:none;border-top:1px solid var(--border)}
.ctx-label{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--s2);border-radius:var(--rl);padding:11px 13px}
.kpi-l{font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.kpi-v{font-size:20px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;line-height:1}
.kpi-s{font-size:9.5px;color:var(--t2);margin-top:3px}
.kpi-v.g{color:var(--green)}.kpi-v.a{color:var(--amber)}.kpi-v.r{color:var(--red)}
.kpi.full{grid-column:span 2}
.drill-list{display:flex;flex-direction:column;gap:2px}
.drill-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r);cursor:pointer;transition:background .1s;border:1px solid transparent}
.drill-item:hover{background:var(--s2);border-color:var(--border)}
.drill-item.active{background:var(--gnl);border-color:#b8d9c4}
.drill-label{font-size:12px;font-weight:500}
.drill-sub{font-size:10px;color:var(--t2);margin-top:1px}
.drill-val{font-family:var(--mono);font-size:11px;color:var(--t2);text-align:right}
.drill-pct{font-size:9.5px;margin-top:1px;text-align:right}
.prov-btn{background:none;border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:9px;cursor:pointer;color:var(--t3);font-family:var(--mono);margin-left:4px;transition:all .1s}
.prov-btn:hover{background:var(--s2);color:var(--ink)}
.prov-panel{background:var(--ink);color:#e8e6e0;border-radius:var(--rl);padding:10px 12px;font-family:var(--mono);font-size:10px;line-height:1.6;margin-top:6px;display:none}
.prov-panel.show{display:block}
.prov-row{display:flex;gap:8px;margin-bottom:2px}
.prov-key{color:#888;flex-shrink:0;width:50px}
.prov-val{color:#d4c9b0;word-break:break-all}
.detail{overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.subtabs{display:flex;border-bottom:1px solid var(--border);gap:0;flex-shrink:0}
.stab{padding:6px 13px;font-size:11.5px;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .1s}
.stab:hover{color:var(--ink)}.stab.on{color:var(--ink);font-weight:500;border-bottom-color:var(--gnm)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--rl)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 10px;text-align:left;font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);background:var(--s2);border-bottom:1px solid var(--border);white-space:nowrap}
th.r{text-align:right}
td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink)}
td.r{text-align:right;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
td.cp{cursor:copy}td.cp:hover{background:var(--gnl);color:var(--gnd)}
td.drill-td{cursor:pointer}td.drill-td:hover{text-decoration:underline;color:var(--green)}
tr:last-child td{border-bottom:none}
tr.tot td{background:var(--s2);font-weight:600;border-top:2px solid var(--border)}
tr.sub-row td{background:#fafaf8;padding:5px 10px 5px 26px;font-size:11px;color:var(--t2)}
tr.sub-row td.r{font-size:10.5px}
tr:hover:not(.tot):not(.sub-row):not(.monthly-row) td{background:var(--s2)}
tr.monthly-row td{background:#f7faf8;padding:4px 10px 4px 32px;font-size:11px;color:var(--t2);border-bottom:1px solid #eae8e0}
tr.grp-hd td{background:var(--s3);font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);padding:4px 10px}
.pb{display:flex;align-items:center;gap:5px;min-width:72px}
.pb-t{flex:1;height:4px;background:var(--s3);border-radius:99px;overflow:hidden}
.pb-f{height:100%;border-radius:99px}
.pb-f.g{background:var(--gnm)}.pb-f.a{background:#d4920a}.pb-f.r{background:#c0392b}
.pb-n{font-family:var(--mono);font-size:10px;min-width:32px;text-align:right;color:var(--t2)}
.hm-wrap{overflow-x:auto;padding:10px}
.hm{border-collapse:separate;border-spacing:3px;min-width:100%}
.hm th{font-size:9px;font-weight:500;color:var(--t3);padding:3px 6px;text-align:right;background:none;border:none;white-space:nowrap;text-transform:none;letter-spacing:0}
.hm th.lbl{text-align:left;font-size:10.5px;color:var(--t2)}
.hm td{padding:5px 8px;text-align:right;font-family:var(--mono);font-size:10.5px;border-radius:4px;cursor:copy;min-width:50px}
.hm td.lbl{text-align:left;font-family:var(--body);font-size:11.5px;color:var(--ink);cursor:pointer;border-radius:0;background:none}
.hm td.lbl:hover{text-decoration:underline;color:var(--green)}
.h0{background:#f0efe9;color:var(--t3)}.h1{background:#d8f0e4;color:#1e6b40}
.h2{background:#a8dbbf;color:#155a35}.h3{background:#6cc49a;color:#0c3520}
.h4{background:#22915a;color:#fff}.h5{background:#15512f;color:#c8eed8}
.hw{background:#fef3dc;color:var(--amber)}.hn{background:#f5f4f0;color:var(--t3)}
.spark-wrap{padding:4px 0}
.srow{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.srow:last-child{border-bottom:none}.srow:hover{background:var(--s2)}.srow.active{background:var(--gnl)}
.s-lbl{font-size:11.5px;flex:0 0 160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.s-bars{flex:1;position:relative;height:22px}
.s-ang{position:absolute;top:1px;left:0;height:8px;background:var(--s3);border-radius:2px}
.s-real{position:absolute;top:11px;left:0;height:8px;border-radius:2px}
.s-real.g{background:var(--gnm)}.s-real.a{background:#d4920a}.s-real.r{background:#c0392b}
.s-pct{font-family:var(--mono);font-size:10px;color:var(--t2);flex:0 0 34px;text-align:right}
.s-v{font-family:var(--mono);font-size:10px;flex:0 0 48px;text-align:right;color:var(--t3)}
.chart-wrap{position:relative;padding:12px}
.chart-leg{display:flex;gap:14px;font-size:10px;color:var(--t2);padding:0 12px 8px}
.leg-sq{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.b-csv{background:var(--gnl);color:var(--gnd);border:1px solid #b5d9c4}
.b-ncsv{background:var(--bll);color:var(--blue);border:1px solid #b5cfe0}
.b-pu{background:var(--gnl);color:var(--gnd);border:1px solid #b5d9c4}
.b-sr{background:var(--bll);color:var(--blue);border:1px solid #b5cfe0}
.b-hq{background:#f0eaf8;color:#42187a;border:1px solid #c8b0e0}
.b-all{background:var(--s3);color:var(--t2);border:1px solid var(--border)}
.b-induk{background:#fff8e8;color:#6b4800;border:1px solid #e8d090}
.b-turunan{background:#f0eaff;color:#3d1880;border:1px solid #c8a8f0}
.xbtn{background:none;border:1px solid var(--border);border-radius:3px;padding:0 5px;font-size:9.5px;cursor:pointer;color:var(--t3);font-family:var(--mono);margin-left:4px;height:16px;transition:all .1s}
.xbtn:hover{background:var(--s2);color:var(--ink)}.xbtn.open{background:var(--ink);color:#fff;border-color:var(--ink)}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:1px 5px;border-radius:3px;background:#fef9e8;border:1px solid #f0d060;color:#7a5800;font-family:var(--mono);cursor:help}
.flag.cov{background:#fdf0f0;border-color:#f0a0a0;color:#7a1515}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#e8e6e0;padding:7px 14px;border-radius:var(--r);font-size:10.5px;font-family:var(--mono);opacity:0;transform:translateY(5px);transition:all .15s;pointer-events:none;z-index:9999}
#toast.on{opacity:1;transform:translateY(0)}
.empty{padding:40px;text-align:center;color:var(--t3);font-size:12px}
.sec-head{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}

/* H3 specific */
.prog-block{background:var(--surf);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:10px}
.prog-block-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;transition:background .1s}
.prog-block-head:hover{background:var(--s2)}
.prog-block-head.open{border-bottom:1px solid var(--border)}
.prog-block-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.prog-block-meta{font-size:10.5px;color:var(--t2);display:flex;gap:14px;font-family:var(--mono)}
.prog-block-body{padding:0}
.unit-block{border-bottom:1px solid var(--border)}
.unit-block:last-child{border-bottom:none}
.unit-block-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 8px 22px;cursor:pointer;background:var(--s2);user-select:none}
.unit-block-head:hover{background:var(--s3)}
.unit-block-head.open{border-bottom:1px solid var(--border)}
.unit-block-body{overflow:hidden}
.bengkel-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);font-size:12px}
.bengkel-row:last-child{border-bottom:none}
.bengkel-row:hover{background:var(--s2)}
.bengkel-row.expanded{background:var(--gnl)}
.br-main{display:flex;align-items:center;flex:1;padding:7px 14px 7px 30px;cursor:pointer;gap:8px}
.br-nama{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-meta{font-size:10px;color:var(--t2);flex-shrink:0}
.br-tipe{flex-shrink:0}
.br-nums{display:flex;gap:16px;flex-shrink:0;padding-right:10px}
.br-num{text-align:right}
.br-num-v{font-family:var(--mono);font-size:11px}
.br-num-l{font-size:9px;color:var(--t3)}
.monthly-expand{background:#f0faf4;border-top:1px solid #c8e8d4;padding:10px 30px}
.monthly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.month-cell{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:7px 8px}
.month-cell-name{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.month-cell-row{display:flex;justify-content:space-between;font-size:10px;line-height:1.5}
.month-cell-key{color:var(--t3)}
.month-cell-val{font-family:var(--mono);color:var(--ink)}
.month-cell.empty{background:var(--s2);border-style:dashed}
.month-cell.empty .month-cell-val{color:var(--t3)}
.yr-tabs{display:flex;gap:4px;margin-bottom:10px}
.yr-tab{padding:3px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:10.5px;cursor:pointer;background:var(--surf);color:var(--t2);font-family:var(--mono)}
.yr-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.search-input{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-family:var(--body);font-size:12px;flex:1;min-width:160px;background:var(--surf)}
.search-input:focus{outline:none;border-color:var(--border2)}
.filter-sel{padding:6px 8px;border:1px solid var(--border);border-radius:var(--r);font-family:var(--body);font-size:11.5px;background:var(--surf)}
.stat-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:9.5px;font-family:var(--mono)}
.sp-aktif{background:#e6f2eb;color:#15512f;border:1px solid #b5d9c4}
.sp-tidak{background:#fdf0f0;color:#7a1515;border:1px solid #f0b0b0}
.sp-baru{background:#fef8e6;color:#6b3800;border:1px solid #e8d090}
.sp-unk{background:var(--s2);color:var(--t3);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="shell">

<aside class="sidebar">
  <div class="sb-top">
    <div class="sb-eyebrow">SROI Dashboard</div>
    <div class="sb-title">PT Pertamina Lubricants</div>
  </div>
  <nav class="sb-nav">
    <div class="sb-grp">Halaman</div>
    <div class="sb-item" onclick="nav('program',this)" id="nav-program">
      <span class="dot" style="background:#22915a"></span> Per Program
    </div>
    <div class="sb-item" onclick="nav('unit',this)" id="nav-unit">
      <span class="dot" style="background:#4a8fd4"></span> Per Unit / SR
    </div>
    <div class="sb-item" onclick="nav('bengkel',this)" id="nav-bengkel">
      <span class="dot" style="background:#d4920a"></span> Bengkel / Mitra
    </div>
    <div class="sb-item" onclick="nav('sroi',this)" id="nav-sroi">
      <span class="dot" style="background:#a060d0"></span> SROI Data
    </div>
    <div id="sroi-yr-nav" style="display:none;padding:2px 0 6px 0"></div>
    <hr class="sb-sep">
    <div class="sb-grp">Navigasi</div>
    <div style="padding:4px 14px 8px;font-size:10.5px;color:#555;line-height:1.8" id="sb-state">—</div>
  </nav>
  <div class="sb-foot">Data: 2019–2025<br>Exclude Sponsorship<br>© Manara Advisory</div>
</aside>

<div class="main">
  <div class="breadcrumb" id="breadcrumb">
    <span class="bc-item active" onclick="bcClick(0)">Dashboard</span>
  </div>
  <div class="split">
    <div class="ctx" id="ctx-panel"><div class="empty">Pilih halaman dari sidebar</div></div>
    <div class="detail" id="detail-panel"><div class="empty">—</div></div>
  </div>

<!-- PAGE: SROI DATA SUPPLY -->
<div id="page-sroi" style="display:none;height:100%;overflow:hidden">
  <div style="height:100%;overflow-y:auto;padding:20px 24px" id="sroi-detail"></div>
</div>

</div>
</div>

<div id="toast"></div>

const M=v=>{if(!v&&v!==0)return'—';if(v>=1e9)return'Rp '+(v/1e9).toFixed(2)+' M';if(v>=1e6)return'Rp '+(v/1e6).toFixed(1)+' jt';if(v>0)return'Rp '+Math.round(v).toLocaleString('id-ID');return'—';};
const FL=v=>v?Math.round(v).toLocaleString('id-ID'):'—';
const PC=(a,r)=>a?Math.round(r/a*100):null;
const PB=(a,r)=>{const p=a?Math.min(r/a*100,150):null;const cls=p===null?'':p>=90?'g':p>=70?'a':'r';const txt=p===null?'—':Math.round(r/a*100)+'%';return`<div class="pb"><div class="pb-t"><div class="pb-f ${cls}" style="width:${p?Math.min(p,100):0}%"></div></div><span class="pb-n">${txt}</span></div>`;};
const hcls=p=>p===null?'hn':p>=110?'hw':p>=90?'h4':p>=80?'h3':p>=70?'h2':p>=50?'h1':'h0';
const CP=(v,d)=>`<td class="r cp" onclick="cp(${v})" title="${FL(v)}">${d||M(v)}</td>`;
const unitBadge=u=>{const t=u==='ALL'?'all':u.startsWith('SR')?'sr':u==='PTPL Pusat'?'hq':'pu';return`<span class="badge b-${t}">${u}</span>`;};
const progBadge=k=>{const p=PRG[k];if(!p)return`<span class="badge">${k}</span>`;return`<span class="badge b-${p.kat==='CSV'?'csv':'ncsv'}">${k}</span>`;};
const tipeBadge=t=>t==='induk'?`<span class="badge b-induk">induk</span>`:t==='turunan'?`<span class="badge b-turunan">turunan</span>`:'';
const statusPill=s=>{if(!s)return'';const m={'aktif':'sp-aktif','baru_aktif':'sp-baru','tidak_aktif':'sp-tidak'};return`<span class="stat-pill ${m[s]||'sp-unk'}">${s.replace('_',' ')}</span>`;};

let toast_t;
function cp(v){navigator.clipboard&&navigator.clipboard.writeText(String(v));const el=document.getElementById('toast');el.textContent='Copied: '+FL(v);el.classList.add('on');clearTimeout(toast_t);toast_t=setTimeout(()=>el.classList.remove('on'),1600);}

let STATE={page:'program',path:[],selYr:'all',selCat:'all',detailView:'table',expanded:new Set(),chart:null,
  // H3 state
  h3Yr:'2024',h3Search:'',h3Status:'all',h3Tipe:'all',
  openProgs:new Set(),openUnits:new Set(),openBengkel:new Set(),
  // H4 state
  sroiYr:'2025',
};

function nav(page,el){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('on'));
  el.classList.add('on');
  STATE.page=page;STATE.path=[];STATE.expanded.clear();
  document.getElementById('page-sroi').style.display=page==='sroi'?'block':'none';
  document.getElementById('sroi-yr-nav').style.display=page==='sroi'?'block':'none';
  if(page==='sroi'){renderSroi();return;}
  if(page!=='bengkel'){STATE.openProgs.clear();STATE.openUnits.clear();STATE.openBengkel.clear();}
  render();
}

function drillTo(type,key,label){STATE.path.push({type,key,label});STATE.expanded.clear();render();}
function bcClick(idx){if(idx>=STATE.path.length)return;STATE.path=STATE.path.slice(0,idx);STATE.expanded.clear();render();}

function renderBreadcrumb(){
  const bc=document.getElementById('breadcrumb');
  let items=`<span class="bc-item ${STATE.path.length===0?'active':''}" onclick="bcClick(0)">Dashboard</span>`;
  STATE.path.forEach((p,i)=>{
    items+=`<span class="bc-sep">›</span><span class="bc-item ${i===STATE.path.length-1?'active':''}" onclick="bcClick(${i+1})">${p.label}</span>`;
  });
  bc.innerHTML=items;
  document.getElementById('sb-state').innerHTML=STATE.path.length>0?STATE.path.map(p=>p.label).join(' › '):'—';
}

function render(){
  renderBreadcrumb();
  if(STATE.page==='sroi'){document.querySelector('.split').style.display='none';}
  else{document.querySelector('.split').style.display='';}
  if(STATE.page==='program') renderProgram();
  else if(STATE.page==='unit') renderUnit();
  else if(STATE.page==='bengkel') renderBengkel();
}

function getCell(prog,unit,yr){return IDX[prog]?.[unit]?.[yr]||null;}

function progAgg(k,yr){
  if(yr!=='all'){
    const c=getCell(k,'ALL',yr)||{};
    if(!c.ang){let ang=0,real=0,pm=0,plan=0,rprog=0;UNITS.forEach(u=>{const uc=getCell(k,u,yr);if(uc){ang+=uc.ang||0;real+=uc.real||0;pm+=uc.pm||0;plan+=uc.plan||0;rprog+=uc.rprog||0;}});return{ang,real,pm,plan,rprog};}
    return{ang:c.ang||0,real:c.real||0,pm:c.pm||0,plan:c.plan||0,rprog:c.rprog||0};
  }
  let ang=0,real=0,pm=0,plan=0,rprog=0;
  YEARS.forEach(y=>{const c=getCell(k,'ALL',y);if(c){ang+=c.ang||0;real+=c.real||0;pm+=c.pm||0;}else{UNITS.forEach(u=>{const uc=getCell(k,u,y);if(uc){ang+=uc.ang||0;real+=uc.real||0;pm+=uc.pm||0;}});}});
  return{ang,real,pm,plan,rprog};
}

function buildProvHTML(rid){
  const rec=RECS[rid];if(!rec)return`<div class="prov-row"><span class="prov-key">id</span><span class="prov-val">${rid} (tidak ditemukan)</span></div>`;
  let html='';
  const ang=rec.anggaran;const real=rec.realisasi;
  if(ang&&ang._src)html+=`<div class="prov-row"><span class="prov-key">anggaran</span><span class="prov-val">${ang._src.file} · ${ang._src.sheet} · row ${ang._src.row}${ang._src.col?' col '+ang._src.col:''}</span></div>`;
  if(real&&real._src)html+=`<div class="prov-row"><span class="prov-key">realisasi</span><span class="prov-val">${real._src.file} · ${real._src.sheet} · row ${real._src.row}${real._src.col?' col '+real._src.col:''}</span></div>`;
  if(rec.pct_realisasi)html+=`<div class="prov-row"><span class="prov-key">% real</span><span class="prov-val">= ${rec.pct_realisasi._formula}</span></div>`;
  html+=`<div class="prov-row"><span class="prov-key">hierarki</span><span class="prov-val">H${rec.h} ${rec.h===1?'(Comp 23-25)':'(Data Rapi)'}</span></div>`;
  return html;

function toggleProv(id){
  const el=document.getElementById(id);if(!el)return;

function toggleExp(key){if(STATE.expanded.has(key))STATE.expanded.delete(key);else STATE.expanded.add(key);if(STATE.page==='sroi')renderSroi();else render();}

function renderProgram(){
  const depth=STATE.path.length;
  if(depth===0) renderProgram_top();
  else if(depth===1){const{type,key}=STATE.path[0];if(type==='program')renderProgram_prog(key);}
  else if(depth===2){const prog=STATE.path[0].key;const unit=STATE.path[1].key;renderProgram_progUnit(prog,unit);}
}

    <div>
      <div class="ctx-badge" style="background:var(--s2);color:var(--t2);border:1px solid var(--border)">Program Overview</div>
      <div class="ctx-name" style="margin-top:8px">Semua Program TJSL</div>
      <div class="ctx-sub">PT Pertamina Lubricants · ${STATE.selYr==='all'?'2019–2025':STATE.selYr}</div>
    </div>

      <div class="kpi"><div class="kpi-l">Realisasi</div><div class="kpi-v ${pp>=90?'g':pp>=70?'a':'r'}">${M(tR)}</div><div class="kpi-s">${pp}%</div></div>
      <div class="kpi"><div class="kpi-l">PM</div><div class="kpi-v">${tPM?tPM.toLocaleString('id-ID'):'—'}</div><div class="kpi-s">orang</div></div>

function renderProgram_prog(prog){

    <div>${progBadge(prog)}<div class="ctx-name" style="margin-top:8px">${p.label}</div><div class="ctx-sub">${p.kat} · sejak ${p.sejak||'—'}</div></div>

      <div class="kpi"><div class="kpi-l">Realisasi</div><div class="kpi-v ${pp>=90?'g':pp>=70?'a':'r'}">${M(tR)}</div><div class="kpi-s">${pp}%</div></div>

    </div>

    </select></div>

function renderUnit(){
  const depth=STATE.path.length;
  if(depth===0) renderUnit_top();
  else if(depth===1){const{type,key}=STATE.path[0];if(type==='unit')renderUnit_unit(key);}
  else if(depth===2){const unit=STATE.path[0].key;const prog=STATE.path[1].key;renderProgram_progUnit(prog,unit);}
}

function unitTotal(u,yr){
  const yrs=yr==='all'?YEARS:[yr];
  let ang=0,real=0,pm=0;
  Object.keys(IDX).forEach(prog=>yrs.forEach(y=>{const c=getCell(prog,u,y);if(c){ang+=c.ang||0;real+=c.real||0;pm+=c.pm||0;}}));
  return{ang,real,pm};
}

function renderUnit_top(){
  let tA=0,tR=0,tPM=0;UNITS.forEach(u=>{const d=unitTotal(u,STATE.selYr);tA+=d.ang;tR+=d.real;tPM+=d.pm;});
  const pp=PC(tA,tR);
  document.getElementById('ctx-panel').innerHTML=`
    <div><div class="ctx-badge" style="background:var(--s2);color:var(--t2);border:1px solid var(--border)">Unit Overview</div><div class="ctx-name" style="margin-top:8px">Semua Unit / SR</div><div class="ctx-sub">${STATE.selYr==='all'?'2019–2025':STATE.selYr}</div></div>
    <div class="kpi-grid"><div class="kpi full"><div class="kpi-l">Anggaran</div><div class="kpi-v">${M(tA)}</div><div class="kpi-s">${FL(tA)}</div></div><div class="kpi"><div class="kpi-l">Realisasi</div><div class="kpi-v ${pp>=90?'g':pp>=70?'a':'r'}">${M(tR)}</div><div class="kpi-s">${pp}%</div></div><div class="kpi"><div class="kpi-l">PM</div><div class="kpi-v">${tPM?tPM.toLocaleString('id-ID'):'—'}</div><div class="kpi-s">orang</div></div></div>
    <hr class="ctx-divider">
    <div><div class="ctx-label">Filter tahun</div><select style="width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r);font-family:var(--body);font-size:11px;background:var(--surf)" onchange="STATE.selYr=this.value;render()"><option value="all" ${STATE.selYr==='all'?'selected':''}>Semua tahun</option>${YEARS.map(y=>`<option value="${y}" ${STATE.selYr===y?'selected':''}>${y}</option>`).join('')}</select></div>
    <hr class="ctx-divider">
    <div><div class="ctx-label">Drill ke unit →</div><div class="drill-list">${UNITS.map(u=>{const d=unitTotal(u,STATE.selYr);const pv=PC(d.ang,d.real);const cl=pv===null?'':pv>=90?'g':pv>=70?'a':'r';const clr=cl==='g'?'var(--green)':cl==='a'?'var(--amber)':cl==='r'?'var(--red)':'var(--t3)';return`<div class="drill-item" onclick="drillTo('unit','${u}','${u}')"><div><div class="drill-label">${unitBadge(u)} ${u}</div></div><div><div class="drill-val">${M(d.ang)}</div><div class="drill-pct" style="color:${clr}">${pv!==null?pv+'%':'—'}</div></div></div>`;}).join('')}</div></div>`;
  renderUnit_matrix();

function renderUnit_matrix(){
  const selYr=STATE.selYr;const isSingle=selYr!=='all';
  const tabs=mkDetailTabs([['table','Tabel'],['heatmap','Heatmap %'],['spark','Spark']],STATE.detailView);

      content+=`<tr class="tot"><td>Total</td>${aYrs.map(()=>'<td class="r">—</td><td class="r">—</td>').join('')}${CP(tA)}<td>${PB(tA,tR)}</td></tr></tbody></table></div>`;
    }
  } else if(STATE.detailView==='heatmap'){

    content=`<div class="hm-wrap"><table class="hm"><thead><tr><th class="lbl">Unit</th>${yrs.map(y=>`<th>${y}</th>`).join('')}${yrs.length>1?'<th>Avg</th>':''}</tr></thead><tbody>`;
    UNITS.forEach(u=>{content+=`<tr><td class="lbl" onclick="drillTo('unit','${u}','${u}')">${u}</td>`;let sumP=0,cnt=0;yrs.forEach(y=>{const d=unitTotal(u,y);if(d.ang||d.real){const pv=PC(d.ang,d.real);content+=`<td class="${hcls(pv)}" onclick="cp(${d.real})">${pv!==null?pv+'%':'—'}</td>`;if(pv!==null){sumP+=pv;cnt++;}}else content+='<td class="hn">—</td>';});if(yrs.length>1){const avg=cnt?Math.round(sumP/cnt):null;content+=`<td class="${hcls(avg)}" style="font-style:italic">${avg!==null?avg+'%':'—'}</td>`;}content+='</tr>';});
    content+='</tbody></table></div>';
  } else {

  }
  document.getElementById('detail-panel').innerHTML=tabs+content;
}

function renderBengkel(){
  const yr=STATE.h3Yr;
  const search=STATE.h3Search.toLowerCase();
  const statusFlt=STATE.h3Status;
  const tipeFlt=STATE.h3Tipe;

  // Aggregate totals
  let totBengkel=0,totAktif=0,totVol=0,totVal=0,totJas=0;
  Object.values(BKL).forEach(b=>{
    if(search&&!b.nama.toLowerCase().includes(search))return;
    if(statusFlt!=='all'&&b.status!==statusFlt)return;
    if(tipeFlt!=='all'&&b.tipe!==tipeFlt)return;
    totBengkel++;
    if(b.status==='aktif'||b.status==='baru_aktif')totAktif++;
    const ann=b.data?.[yr]?.annual;
    if(ann){totVol+=ann.vol||0;totVal+=ann.val||0;totJas+=ann.jas||0;}
  });

  // Context panel
  document.getElementById('ctx-panel').innerHTML=`
    <div>
      <div class="ctx-badge" style="background:var(--s2);color:var(--t2);border:1px solid var(--border)">Bengkel / Mitra</div>
      <div class="ctx-name" style="margin-top:8px">Daftar Mitra Binaan</div>
      <div class="ctx-sub">Data ${yr} · ${totBengkel} mitra tampil</div>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-l">Total Mitra</div><div class="kpi-v">${totBengkel}</div><div class="kpi-s">${totAktif} aktif</div></div>
      <div class="kpi"><div class="kpi-l">Vol Pelumas</div><div class="kpi-v g">${totVol.toLocaleString('id-ID')}</div><div class="kpi-s">botol</div></div>
      <div class="kpi"><div class="kpi-l">Nilai Pelumas</div><div class="kpi-v">${M(totVal)}</div><div class="kpi-s">${FL(totVal)}</div></div>
      <div class="kpi"><div class="kpi-l">Pendapatan Jasa</div><div class="kpi-v">${M(totJas)}</div><div class="kpi-s">${FL(totJas)}</div></div>
    </div>
    <hr class="ctx-divider">
    <div>
      <div class="ctx-label">Keterangan</div>

        <span class="badge b-turunan">turunan</span> = lahir dari program turunan<br>
        <span class="flag">⚑</span> = perlu review<br>
        <span class="flag cov">⚑</span> = coverage gap
      </div>
    </div>`;

  // Detail panel: accordion program → unit → bengkel
  let html=`<div class="search-bar">
    <input class="search-input" type="text" placeholder="Cari nama bengkel…" value="${STATE.h3Search}" oninput="STATE.h3Search=this.value;render()">

  </div>
  <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    <select class="filter-sel" onchange="STATE.h3Status=this.value;render()">
      <option value="all" ${statusFlt==='all'?'selected':''}>Semua status</option>
      <option value="aktif" ${statusFlt==='aktif'?'selected':''}>Aktif</option>
      <option value="baru_aktif" ${statusFlt==='baru_aktif'?'selected':''}>Baru aktif</option>
      <option value="tidak_aktif" ${statusFlt==='tidak_aktif'?'selected':''}>Tidak aktif</option>
    </select>
    <select class="filter-sel" onchange="STATE.h3Tipe=this.value;render()">
      <option value="all" ${tipeFlt==='all'?'selected':''}>Semua tipe</option>
      <option value="induk" ${tipeFlt==='induk'?'selected':''}>Induk</option>
      <option value="turunan" ${tipeFlt==='turunan'?'selected':''}>Turunan</option>
    </select>
  </div>`;

  // Group by program
  const progOrder=Object.keys(PRG).filter(k=>PUS[k]);
  progOrder.forEach(prog=>{
    if(!PUS[prog])return;
    const pLabel=PRG[prog]?.label||prog;
    const pKat=PRG[prog]?.kat||'';

    // Check if any bengkel in this prog pass filters
    let progHasData=false;
    Object.entries(PUS[prog]).forEach(([unit,us])=>{
      us.ids.forEach(bid=>{
        const b=BKL[bid];if(!b)return;
        if(search&&!b.nama.toLowerCase().includes(search))return;
        if(statusFlt!=='all'&&b.status!==statusFlt)return;
        if(tipeFlt!=='all'&&b.tipe!==tipeFlt)return;
        progHasData=true;
      });
    });
    if(!progHasData)return;

    // Prog-level aggregates
    let pVol=0,pVal=0,pJas=0,pN=0,pAktif=0;
    Object.values(PUS[prog]).forEach(us=>{
      us.ids.forEach(bid=>{
        const b=BKL[bid];if(!b)return;
        if(search&&!b.nama.toLowerCase().includes(search))return;
        if(statusFlt!=='all'&&b.status!==statusFlt)return;
        if(tipeFlt!=='all'&&b.tipe!==tipeFlt)return;
        pN++;
        if(b.status==='aktif'||b.status==='baru_aktif')pAktif++;
        const ann=b.data?.[yr]?.annual;if(ann){pVol+=ann.vol||0;pVal+=ann.val||0;pJas+=ann.jas||0;}
      });
    });

    const pOpen=STATE.openProgs.has(prog);
    html+=`<div class="prog-block">
      <div class="prog-block-head ${pOpen?'open':''}" onclick="h3ToggleProg('${prog}')">
        <div class="prog-block-title">${progBadge(prog)} ${pLabel}</div>
        <div class="prog-block-meta">
          <span>${pN} mitra</span>
          <span>${pAktif} aktif</span>
          ${pVol?`<span>${pVol.toLocaleString()} btl</span>`:''}
          ${pVal?`<span>${M(pVal)} pelumas</span>`:''}
          ${pJas?`<span>${M(pJas)} jasa</span>`:''}
          <span style="color:var(--t3)">${pOpen?'▲':'▼'}</span>
        </div>
      </div>`;

    if(pOpen){
      html+=`<div class="prog-block-body">`;
      const unitOrder=UNITS.filter(u=>PUS[prog][u]);
      unitOrder.forEach(unit=>{
        const us=PUS[prog][unit];
        // Filter ids
        const visIds=us.ids.filter(bid=>{
          const b=BKL[bid];if(!b)return false;
          if(search&&!b.nama.toLowerCase().includes(search))return false;
          if(statusFlt!=='all'&&b.status!==statusFlt)return false;
          if(tipeFlt!=='all'&&b.tipe!==tipeFlt)return false;
          return true;
        });
        if(!visIds.length)return;

        let uVol=0,uVal=0,uJas=0;
        visIds.forEach(bid=>{const b=BKL[bid];const ann=b.data?.[yr]?.annual;if(ann){uVol+=ann.vol||0;uVal+=ann.val||0;uJas+=ann.jas||0;}});

        const uKey=prog+'__'+unit;const uOpen=STATE.openUnits.has(uKey);
        html+=`<div class="unit-block">
          <div class="unit-block-head ${uOpen?'open':''}" onclick="h3ToggleUnit('${prog}','${unit}')">
            <div style="display:flex;align-items:center;gap:8px">
              ${unitBadge(unit)}
              <span style="font-size:11.5px;font-weight:500">${unit}</span>
              <span style="font-size:10px;color:var(--t2)">${visIds.length} mitra</span>
            </div>
            <div style="display:flex;gap:12px;font-family:var(--mono);font-size:10px;color:var(--t2)">
              ${uVol?`<span>${uVol.toLocaleString()} btl</span>`:''}
              ${uVal?`<span>${M(uVal)}</span>`:''}
              ${uJas?`<span>${M(uJas)} jasa</span>`:''}
              <span style="color:var(--t3)">${uOpen?'▲':'▼'}</span>
            </div>
          </div>`;

        if(uOpen){
          html+=`<div class="unit-block-body">`;
          // Table header
          html+=`<div style="display:grid;grid-template-columns:1fr 80px 80px 80px 80px 70px;padding:5px 14px 5px 30px;font-size:8.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border);background:var(--s2)">
            <span>Mitra</span><span style="text-align:right">Vol (btl)</span><span style="text-align:right">Pelumas</span><span style="text-align:right">Jasa</span><span style="text-align:right">Status</span><span></span></div>`;

          visIds.forEach(bid=>{
            const b=BKL[bid];
            const ann=b.data?.[yr]?.annual;
            const monthly=b.data?.[yr]?.monthly||[];
            const bOpen=STATE.openBengkel.has(bid);
            const flagHtml=b.flags.map(f=>`<span class="flag ${f==='COVERAGE_GAP'?'cov':''}" title="${b.flag_detail?.find(d=>d.kode===f)?.pesan||f}">⚑ ${f}</span>`).join(' ');

            html+=`<div class="bengkel-row ${bOpen?'expanded':''}">
              <div class="br-main" onclick="h3ToggleBengkel('${bid}')">
                <div>
                  <div class="br-nama" title="${b.nama}">${b.nama}</div>
                  <div style="font-size:9.5px;color:var(--t3);margin-top:1px">${tipeBadge(b.tipe)} sejak ${b.thn||'?'} · ${b.anggota?b.anggota+' anggota':'—'} ${flagHtml}</div>
                </div>
              </div>
              <div class="br-nums">
                <div class="br-num"><div class="br-num-v" onclick="cp(${ann?.vol||0})" style="cursor:copy">${ann?ann.vol.toLocaleString():'—'}</div><div class="br-num-l">botol</div></div>
                <div class="br-num"><div class="br-num-v" onclick="cp(${ann?.val||0})" style="cursor:copy">${ann?M(ann.val):'—'}</div><div class="br-num-l">pelumas</div></div>
                <div class="br-num"><div class="br-num-v" onclick="cp(${ann?.jas||0})" style="cursor:copy">${ann?M(ann.jas):'—'}</div><div class="br-num-l">jasa</div></div>
                <div class="br-num">${statusPill(b.status)||'—'}</div>
                <div class="br-num"><button class="xbtn ${bOpen?'open':''}" onclick="h3ToggleBengkel('${bid}')" title="${monthly.length?'Lihat data bulanan':'Tidak ada data bulanan'}">${bOpen?'▲':'▼'}${monthly.length?'':' —'}</button></div>
              </div>
            </div>`;

            if(bOpen){
              // Monthly grid
              html+=`<div class="monthly-expand">`;
              // Info bar
              if(b.pic||b.alamat){
                html+=`<div style="font-size:10px;color:var(--t2);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap">`;
                if(b.pic)html+=`<span>📞 ${b.pic}</span>`;
                if(b.alamat)html+=`<span>📍 ${b.alamat.substring(0,60)}${b.alamat.length>60?'…':''}</span>`;
                html+=`</div>`;
              }
              if(monthly.length){
                html+=`<div class="monthly-grid">`;
                MONTHS.forEach(m=>{
                  const md=monthly.find(x=>x.bln===m);
                  if(md){
                    html+=`<div class="month-cell">
                      <div class="month-cell-name">${m}</div>
                      <div class="month-cell-row"><span class="month-cell-key">vol</span><span class="month-cell-val" onclick="cp(${md.vol})" style="cursor:copy">${md.vol.toLocaleString()}</span></div>
                      <div class="month-cell-row"><span class="month-cell-key">pel</span><span class="month-cell-val" onclick="cp(${md.val})" style="cursor:copy">${M(md.val)}</span></div>
                      <div class="month-cell-row"><span class="month-cell-key">jas</span><span class="month-cell-val" onclick="cp(${md.jas})" style="cursor:copy">${M(md.jas)}</span></div>
                    </div>`;
                  } else {
                    html+=`<div class="month-cell empty"><div class="month-cell-name">${m}</div><div class="month-cell-val" style="font-size:10px">—</div></div>`;
                  }
                });
                html+=`</div>`;
              } else {
                html+=`<div style="font-size:11px;color:var(--t3);padding:8px 0">Tidak ada data bulanan untuk tahun ${yr}</div>`;
              }
              html+=`</div>`;
            }
          });
          html+=`</div>`;
        }
        html+=`</div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });

  document.getElementById('detail-panel').innerHTML=html;
}

window.h3ToggleProg=function(prog){if(STATE.openProgs.has(prog))STATE.openProgs.delete(prog);else STATE.openProgs.add(prog);render();};
window.h3ToggleUnit=function(prog,unit){const k=prog+'__'+unit;if(STATE.openUnits.has(k))STATE.openUnits.delete(k);else STATE.openUnits.add(k);render();};
window.h3ToggleBengkel=function(bid){if(STATE.openBengkel.has(bid))STATE.openBengkel.delete(bid);else STATE.openBengkel.add(bid);render();};

function toggleProv(id){const el=document.getElementById(id);if(!el)return;const row=document.getElementById('prov-row-'+id.replace('prov-',''));if(el.classList.contains('show')){el.classList.remove('show');if(row)row.style.display='none';}else{el.classList.add('show');if(row)row.style.display='';}}

// ════════════════════════════
// PAGE: SROI DATA SUPPLY (H4)
// ════════════════════════════
function renderSroi(){
  if(typeof SROI === 'undefined'){
    const el=document.getElementById('sroi-detail');
    if(el) el.innerHTML='<div class="empty">Data SROI belum dimuat.</div>';
    return;
  }

  // filtProg: read from existing select if present, else default 'all'
  const _sel = document.getElementById('sroi-prog');
  const filtProg = _sel ? _sel.value : 'all';
  const S = SROI;
  const YEARS_H4 = ['2019','2020','2021','2022','2023','2024','2025'];
  const yr = STATE.sroiYr;

  // ── Sidebar: year sub-nav under SROI Data ──
  const yrNav = document.getElementById('sroi-yr-nav');
  if(yrNav) {
    yrNav.style.display = 'block';
    yrNav.innerHTML = YEARS_H4.slice().reverse().map(y => {
      const d2 = filtProg==='all' ? S.year_totals[y] : S.prog_year[filtProg]?.[y];
      const pct2 = d2?.ang ? Math.round(d2.real/d2.ang*100) : null;
      const isOn = y === yr;
      const pctC = pct2===null?'#666':pct2>=90?'#5aab7a':pct2>=70?'#c4830a':'#c0392b';
      return `<div onclick="STATE.sroiYr='${y}';STATE.expanded.clear();renderSroi()"
        style="display:flex;align-items:center;justify-content:space-between;
               padding:5px 14px 5px 28px;cursor:pointer;
               background:${isOn?'rgba(34,145,90,.1)':'transparent'};
               border-left:2px solid ${isOn?'var(--gnm)':'transparent'};
               transition:background .1s">
        <span style="font-size:11px;font-family:var(--mono);
                     color:${isOn?'#e8e6e0':'#888'};
                     font-weight:${isOn?'500':'400'}">${y}</span>
        <span style="font-size:10px;font-family:var(--mono);color:${pctC}">${pct2!==null?pct2+'%':'—'}</span>
      </div>`;
    }).join('');
  }

  // ── Right panel: single year ──
  const detail = document.getElementById('sroi-detail');
  if(!detail) return;

  const d = filtProg==='all' ? S.year_totals[yr] : S.prog_year[filtProg]?.[yr];
  const cov = {'2019':{sales:false,pm:'parsial'},'2020':{sales:false,pm:'ada'},'2021':{sales:false,pm:'ada'},'2022':{sales:false,pm:'ada'},'2023':{sales:false,pm:'ada'},'2024':{sales:true,pm:'ada'},'2025':{sales:true,pm:'ada'}};
  const hasSales = cov[yr]?.sales;

  if(!d) {
    detail.innerHTML=`<div class="empty">Tidak ada data untuk tahun ${yr}</div>`;
    return;
  }

  const pct = d.ang ? Math.round(d.real/d.ang*100) : null;
  const pctCol = pct===null?'var(--t3)':pct>=90?'var(--green)':pct>=70?'var(--amber)':'var(--red)';
  const accentColor = pct===null?'var(--border2)':pct>=90?'var(--gnm)':pct>=70?'#d4920a':'#c0392b';
  const accentBg = pct===null?'transparent':pct>=90?'rgba(34,145,90,.04)':pct>=70?'rgba(212,146,10,.04)':'rgba(192,57,43,.04)';

  // progress bar helper
  const pBar = (val, tot, cls='g') => {
    const w = tot ? Math.min(val/tot*100, 100) : 0;
    return `<div style="height:3px;background:var(--s3);border-radius:99px;overflow:hidden;margin-top:5px">
      <div style="height:100%;width:${w}%;background:${cls==='g'?'var(--gnm)':cls==='a'?'#d4920a':'#c0392b'};border-radius:99px"></div>
    </div>`;
  };
  const pBarCls = pct===null?'g':pct>=90?'g':pct>=70?'a':'r';

  // KPI card — single vertical card, top→bottom flow
  let html = `
  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div>
      <div style="font-size:24px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;line-height:1">${yr}</div>
      <div style="font-size:11px;color:var(--t2);margin-top:4px">${filtProg==='all'?'Semua program TJSL':PRG[filtProg]?.label||filtProg}</div>
    </div>
    <div>
      <select id="sroi-prog" style="padding:5px 8px;border:1px solid var(--border);border-radius:var(--r);font-family:var(--body);font-size:11.5px;background:var(--surf)" onchange="renderSroi()">
        <option value="all" ${filtProg==='all'?'selected':''}>Semua program</option>
        ${Object.entries(PRG).map(([k,p])=>`<option value="${k}" ${filtProg===k?'selected':''}>${p.label}</option>`).join('')}
      </select>
    </div>
  </div>

  <!-- KPI Card -->
  <div style="background:var(--surf);border:1px solid var(--border);border-left:4px solid ${accentColor};border-radius:var(--rl);overflow:hidden;margin-bottom:18px">

    <!-- Section: INPUT -->
    <div style="padding:14px 16px;background:${accentBg}">
      <div style="font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:12px">Input Program</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:12px;color:var(--t2)">Anggaran</span>
        <span style="font-family:var(--mono);font-size:13px;cursor:copy" onclick="cp(${d.ang})" title="Rp ${FL(d.ang)}">${M(d.ang)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
        <span style="font-size:12px;color:var(--t2)">Realisasi</span>
        <span style="font-family:var(--mono);font-size:13px;font-weight:600;color:${pctCol};cursor:copy" onclick="cp(${d.real})" title="Rp ${FL(d.real)}">${M(d.real)}</span>
      </div>
      ${pBar(d.real, d.ang, pBarCls)}
      <div style="display:flex;justify-content:flex-end;margin-top:4px">
        <span style="font-family:var(--mono);font-size:11px;color:${pctCol};font-weight:600">${pct!==null?pct+'% realisasi':'—'}</span>
      </div>
    </div>

    <!-- Divider -->
    <div style="height:1px;background:var(--border)"></div>

    <!-- Section: OUTPUT PESERTA -->
    <div style="padding:14px 16px">
      <div style="font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:12px">Output — Peserta</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;color:var(--t2)">PM (Penerima Manfaat)${cov[yr]?.pm==='parsial'?` <span style="font-size:9px;background:var(--aml);color:var(--amber);padding:1px 5px;border-radius:3px">parsial</span>`:''}</span>
        <span style="font-family:var(--mono);font-size:16px;font-weight:600;cursor:copy" onclick="cp(${d.pm||0})">${d.pm?d.pm.toLocaleString('id-ID'):'—'}</span>
      </div>
      ${d.pm?`<div style="font-size:10px;color:var(--t3);text-align:right;margin-top:2px">orang</div>`:''}
    </div>

    <!-- Divider -->
    <div style="height:1px;background:var(--border)"></div>

    <!-- Section: OUTPUT EKONOMI -->
    <div style="padding:14px 16px">
      <div style="font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:12px">Output — Ekonomi Mitra</div>
      ${hasSales ? `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span style="font-size:12px;color:var(--t2)">Vol. pelumas terjual</span>
        <span style="font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green);cursor:copy" onclick="cp(${d.vol||0})">${d.vol?Math.round(d.vol).toLocaleString()+' btl':'—'}</span>
      </div>
      <div style="background:var(--s2);border-radius:var(--r);padding:10px 12px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span style="font-size:11px;color:var(--t2)">Nilai pelumas</span>
          <span style="font-family:var(--mono);font-size:12px;cursor:copy" onclick="cp(${d.val||0})">${d.val?M(d.val):'—'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span style="font-size:11px;color:var(--t2)">Pendapatan jasa</span>
          <span style="font-family:var(--mono);font-size:12px;cursor:copy" onclick="cp(${d.jas||0})">${d.jas?M(d.jas):'—'}</span>
        </div>
        <div style="height:1px;background:var(--border);margin-bottom:6px"></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:11px;font-weight:600;color:var(--ink)">Total ekonomi</span>
          <span style="font-family:var(--mono);font-size:13px;font-weight:600;cursor:copy" onclick="cp(${(d.val||0)+(d.jas||0)})">${(d.val||d.jas)?M((d.val||0)+(d.jas||0)):'—'}</span>
        </div>
      </div>` :
      `<div style="font-size:11px;color:var(--t3);font-style:italic;padding:4px 0">Data penjualan belum tersedia untuk tahun ini</div>`}
    </div>

  </div>

  <!-- Program breakdown header -->
  <div style="font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px">
    Breakdown per program
  </div>`;

  // Program list with nested expand
  const progKeys = filtProg==='all' ? Object.keys(S.prog_year) : [filtProg];
  html += progKeys.map(prog => {
    const pd = S.prog_year[prog]?.[yr];
    if(!pd||(!pd.ang&&!pd.real)) return '';
    const pp = pd.ang?Math.round(pd.real/pd.ang*100):null;
    const ppC = pp===null?'var(--t3)':pp>=90?'var(--green)':pp>=70?'var(--amber)':'var(--red)';
    const keyProg = 'sroi-'+yr+'-'+prog;

    const UNITS_ORD=['PUC','PUG','PUJ','PTPL Pusat','SR I','SR II','SR III','SR IV','SR V','SR VI','SR VII'];

      const up=cell.ang?Math.round(cell.real/cell.ang*100):null;
      const upC=up===null?'var(--t3)':up>=90?'var(--green)':up>=70?'var(--amber)':'var(--red)';
      let uVol=0,uVal=0,uJas=0;
      (cell.b_ids||[]).forEach(bid=>{const b=BKL[bid];if(!b)return;const ann=b.data?.[yr]?.annual;if(ann){uVol+=ann.vol||0;uVal+=ann.val||0;uJas+=ann.jas||0;}});
      const keyUnit='sroi-'+yr+'-'+prog+'-'+unit;
      const isUnitExp=STATE.expanded.has(keyUnit);
      const hasBkl=(cell.b_ids||[]).length>0;
      const provBtnUnit=cell.rid?`<button class="prov-btn" onclick="event.stopPropagation();toggleProv('prov-s-${prog}-${unit}-${yr}')">src</button>`:'';

      const bklHtml = isUnitExp ? (cell.b_ids||[]).map(bid=>{
        const b=BKL[bid];if(!b)return'';
        const ann=b.data?.[yr]?.annual;
        return`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 14px 5px 56px;border-bottom:1px solid var(--border);background:#fafffe;font-size:11px">

          <span style="display:flex;gap:10px;font-family:var(--mono);font-size:10.5px">
            <span style="color:var(--green);cursor:copy" onclick="cp(${ann?.vol||0})">${ann&&ann.vol>0?Math.round(ann.vol).toLocaleString()+' btl':'—'}</span>
            <span style="cursor:copy" onclick="cp(${ann?.val||0})">${ann&&ann.val?M(ann.val):'—'}</span>
            <span style="cursor:copy" onclick="cp(${ann?.jas||0})">${ann&&ann.jas?M(ann.jas):'—'}</span>
            <span style="color:var(--t3)">${b.status||'—'}</span>
          </span>
        </div>`;
      }).join('') : '';

      return`<div style="border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 14px 6px 28px;background:var(--s2);cursor:pointer" onclick="toggleExp('sroi-${yr}-${prog}-${unit}')">
          <span style="font-size:11.5px;display:flex;align-items:center;gap:6px">${unitBadge(unit)} ${unit} ${provBtnUnit}${hasBkl?`<span style="font-size:9px;color:var(--t3)">(${cell.b_ids.length})</span>`:''}</span>
          <span style="display:flex;gap:12px;font-family:var(--mono);font-size:11px;align-items:center">
            <span onclick="event.stopPropagation();cp(${cell.ang||0})">${cell.ang?M(cell.ang):'—'}</span>
            <span style="color:${upC}" onclick="event.stopPropagation();cp(${cell.real||0})">${cell.real?M(cell.real):'—'} ${up!==null?up+'%':'—'}</span>
            <span style="color:var(--green)" onclick="event.stopPropagation();cp(${uVol})">${uVol>0?Math.round(uVol).toLocaleString()+' btl':'—'}</span>
            <span onclick="event.stopPropagation();cp(${uJas})">${uJas?M(uJas):'—'}</span>
            ${hasBkl?`<span style="color:var(--t2)">${isUnitExp?'▲':'▼'}</span>`:''}
          </span>
        </div>
        ${cell.rid?`<div style="display:none" id="prov-row-prov-s-${prog}-${unit}-${yr}"><div style="padding:0 14px 6px 28px"><div class="prov-panel show" id="prov-s-${prog}-${unit}-${yr}">${buildProvHTML(cell.rid)}</div></div></div>`:''}
        ${bklHtml}
      </div>`;
    }).join('') : '';

    return`<div style="border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:6px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;background:var(--surf)" onclick="toggleExp('sroi-${yr}-${prog}')">
        <span style="font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px">${progBadge(prog)} ${PRG[prog]?.label||prog} ${provBtnProg}</span>
        <span style="display:flex;gap:10px;font-family:var(--mono);font-size:11px;align-items:center">
          <span onclick="event.stopPropagation();cp(${pd.ang||0})">${M(pd.ang)}</span>
          <span style="color:${ppC}" onclick="event.stopPropagation();cp(${pd.real||0})">${M(pd.real)} ${pp!==null?pp+'%':'—'}</span>
          <span onclick="event.stopPropagation();cp(${pd.pm||0})">${pd.pm?pd.pm.toLocaleString('id-ID')+' org':'—'}</span>
          <button onclick="event.stopPropagation();copyProgram('${prog}','${yr}')" title="Copy data program + bengkel (TSV)"
            style="background:none;border:1px solid var(--border);border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer;color:var(--t2);display:flex;align-items:center;gap:4px;font-family:var(--body);transition:all .1s"
            onmouseover="this.style.background='var(--s2)';this.style.color='var(--ink)'"
            onmouseout="this.style.background='none';this.style.color='var(--t2)'">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H6zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1H2z"/></svg>
            TSV
          </button>
          <span style="color:var(--t2)">${isProgExp?'▲':'▼'}</span>
        </span>
      </div>
      ${pd.rid?`<div style="display:none" id="prov-row-prov-s-${prog}-${yr}"><div style="padding:0 14px 6px 14px"><div class="prov-panel show" id="prov-s-${prog}-${yr}">${buildProvHTML(pd.rid)}</div></div></div>`:''}
      ${unitsHtml}
    </div>`;
  }).join('');

  // Level B: per program multi-year table (compact, below)
  const thS = 'padding:6px 8px;text-align:right;font-size:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);background:var(--s2);border-bottom:1px solid var(--border);white-space:nowrap';
  const activeYrs = YEARS_H4.filter(y => progKeys.some(k => S.prog_year[k]?.[y]));
  html += `<div style="margin-top:20px;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px">Tren per program (semua tahun)</div>
  <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--rl)"><table style="width:100%;border-collapse:collapse;font-size:11.5px">
    <thead><tr>
      <th style="${thS.replace('text-align:right','text-align:left')}">Program</th>
      ${activeYrs.map(y=>`<th style="${thS}" colspan="2">${y}</th>`).join('')}
    </tr><tr>
      <th style="${thS.replace('text-align:right','text-align:left')}"></th>
      ${activeYrs.map(()=>`<th style="${thS}">Real.</th><th style="${thS}">%</th>`).join('')}
    </tr></thead><tbody>`;
  ['CSV','NON-CSV'].forEach(kat=>{
    const grp=progKeys.filter(k=>PRG[k]?.kat===kat&&Object.keys(S.prog_year[k]||{}).length);
    if(!grp.length) return;
    html+=`<tr><td colspan="${1+activeYrs.length*2}" style="padding:3px 8px;background:var(--s3);font-size:8.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);border-bottom:1px solid var(--border)">${kat}</td></tr>`;
    grp.forEach(k=>{
      html+=`<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:5px 10px;font-size:11.5px">${progBadge(k)} ${PRG[k]?.label||k}</td>
        ${activeYrs.map(y=>{
          const pd2=S.prog_year[k]?.[y];
          if(!pd2||(!pd2.ang&&!pd2.real))return`<td colspan="2" style="padding:5px 8px;text-align:right;color:var(--t3);font-family:var(--mono);font-size:10px">—</td>`;
          const pp2=pd2.ang?Math.round(pd2.real/pd2.ang*100):null;
          const ppC2=pp2===null?'var(--t3)':pp2>=90?'var(--green)':pp2>=70?'var(--amber)':'var(--red)';
          const isCurYr=y===yr;
          return`<td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:10px;cursor:copy;${isCurYr?'background:var(--gnl);':''}font-weight:${isCurYr?'600':'400'}" onclick="cp(${pd2.real})">${M(pd2.real)}</td>
                 <td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:10px;color:${ppC2};${isCurYr?'background:var(--gnl);':''}">${pp2!==null?pp2+'%':'—'}</td>`;
        }).join('')}
      </tr>`;
    });
  });
  html += `</tbody></table></div>
  <div style="font-size:9.5px;color:var(--t3);margin-top:10px;line-height:1.7">
    * Vol & nilai pelumas, pendapatan jasa: data 2024–2025 saja &nbsp;·&nbsp;
    * 2025 satuan liter (setara botol) &nbsp;·&nbsp;
    * Klik angka untuk copy
  </div>`;

  detail.innerHTML = html;
}

// ── COPY PROGRAM (TSV) ──
function copyProgram(prog, yr) {
  const S = SROI;
  const pd = S.prog_year[prog]?.[yr];
  if(!pd) return;

  const pLabel = PRG[prog]?.label || prog;
  const pct = pd.ang ? Math.round(pd.real/pd.ang*100) : null;
  const UNITS_ORD = ['PUC','PUG','PUJ','PTPL Pusat','SR I','SR II','SR III','SR IV','SR V','SR VI','SR VII'];

  // ── Baris header program ──
  const lines = [
    `Program\t${prog} — ${pLabel}`,
    `Tahun\t${yr}`,
    `Anggaran\t${pd.ang||0}`,
    `Realisasi\t${pd.real||0}`,
    `% Realisasi\t${pct!==null?pct+'%':'—'}`,
    `PM\t${pd.pm||0}`,
    pd.vol>0?`Vol. pelumas (btl)\t${Math.round(pd.vol||0)}`:'',
    pd.val>0?`Nilai pelumas (Rp)\t${Math.round(pd.val||0)}`:'',
    pd.jas>0?`Pendapatan jasa (Rp)\t${Math.round(pd.jas||0)}`:'',
    '',
    // ── Header tabel bengkel ──
    'Unit\tBengkel\tTipe\tStatus\tTahun Masuk\tVol (btl)\tNilai Pelumas (Rp)\tJasa (Rp)',
  ].filter(l => l !== undefined);

  // ── Baris per bengkel ──
  UNITS_ORD.forEach(unit => {
    const cell = IDX[prog]?.[unit]?.[yr];
    if(!cell || !(cell.b_ids||[]).length) return;
    (cell.b_ids||[]).forEach(bid => {
      const b = BKL[bid]; if(!b) return;
      const ann = b.data?.[yr]?.annual;
      lines.push([
        unit,
        b.nama,
        b.tipe||'—',
        b.status||'—',
        b.thn||'—',
        ann?.vol>0 ? Math.round(ann.vol) : 0,
        ann?.val ? Math.round(ann.val) : 0,
        ann?.jas ? Math.round(ann.jas) : 0,
      ].join('\t'));
    });
  });

  const tsv = lines.join('\n');
  navigator.clipboard.writeText(tsv).then(() => {
    const el = document.getElementById('toast');
    el.textContent = `✓ Copied: ${pLabel} ${yr} (${lines.length} baris TSV)`;
    el.classList.add('on');
    clearTimeout(toast_t);
    toast_t = setTimeout(()=>el.classList.remove('on'), 2500);
  }).catch(() => {
    // Fallback: textarea select
    const ta = document.createElement('textarea');
    ta.value = tsv; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

// ── INIT ──
document.getElementById('nav-program').classList.add('on');
STATE.page='program';
render();
</script>
